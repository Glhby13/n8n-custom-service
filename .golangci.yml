version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - noctx
    - unconvert
  settings:
    gosec:
      excludes:
        - G704 # outbound URLs come from configuration (N8N_BASE_URL, GITLAB_BASE_URL), never from request input
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000", "-ST1003"]
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
