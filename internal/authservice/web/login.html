<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>n8n.io - Workflow Automation</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/sso/assets/login.css">
</head>
<body>
<main class="shell">
  <img class="brand" src="/sso/assets/logo.svg" alt="n8n" width="170" height="48">
  <section class="card">
    <h1>Sign in</h1>
    <form id="f" novalidate>
      <label for="username">Email</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="err" class="err" role="alert" hidden></div>
      <button id="ad" class="btn primary" type="submit">Sign in with AD BTN</button>
      <div class="or"><span>OR</span></div>
      <button id="local" class="btn secondary" type="button">Sign in with local account</button>
    </form>
  </section>
</main>

<div id="modal" class="backdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">Two-factor authentication</h2>
    <p id="m-desc" class="desc"></p>
    <div id="m-qr" class="qr" hidden>
      <img id="m-qr-img" alt="Authenticator QR code" width="200" height="200">
      <div class="manual">Manual key: <code id="m-secret"></code></div>
    </div>
    <form id="m-form" novalidate>
      <label for="m-code">Authenticator code</label>
      <input id="m-code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
      <div id="m-err" class="err" role="alert" hidden></div>
      <button id="m-ok" class="btn primary" type="submit">Verify and sign in</button>
      <button id="m-cancel" class="btn secondary" type="button">Cancel</button>
    </form>
  </div>
</div>
<script src="/sso/assets/login.js"></script>
</body>
</html>
